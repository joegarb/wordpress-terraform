name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3

      - name: Format
        run: terraform fmt -check -recursive

      - name: Validate
        run: |
          set -euo pipefail
          for dir in environments/production environments/staging/staging1; do
            echo "== $dir =="
            terraform -chdir="$dir" init -backend=false -input=false -no-color
            terraform -chdir="$dir" validate -no-color
          done
